name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test root module
        run: go test ./...
      - name: Race test root module
        run: go test -race ./...
      - name: Vet root module
        run: go vet ./...
      - name: Test dashboard module
        working-directory: dashboard
        run: go test ./...
      - name: Race test dashboard module
        working-directory: dashboard
        run: go test -race ./...
      - name: Vet dashboard module
        working-directory: dashboard
        run: go vet ./...
